<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alliance Tracker</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1b16;--mut:#6b675c;--bd:#ddd8cb;--ac:#9a6b12;--ok:#1f7a45;--bad:#b3261e;--warn:#a86400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120e;--card:#1e1b15;--tx:#efeadc;--mut:#a39d8b;--bd:#35302420;--bd:#383226;--ac:#e0b34d;--ok:#5fd08a;--bad:#ff7b72;--warn:#f0b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120e;--card:#1e1b15;--tx:#efeadc;--mut:#a39d8b;--bd:#383226;--ac:#e0b34d;--ok:#5fd08a;--bad:#ff7b72;--warn:#f0b04a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
nav button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}.stat span{color:var(--mut);font-size:12px}
textarea,input,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:140px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:8px 0}
.row>div{flex:1;min-width:140px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{cursor:pointer;color:var(--mut);position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
.up{color:var(--ok)}.dn{color:var(--bad)}.tag{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid currentColor}
.inact{color:var(--warn)}.msg{font-size:13px;margin-top:6px}.empty{color:var(--mut);padding:20px;text-align:center}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}.chk input{width:auto}
</style>
<style>

.wrap{position:relative}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,-50px)}}
@keyframes shine{to{background-position:200% center}}
@keyframes pulse{0%,100%{box-shadow:0 4px 14px rgba(124,58,237,.35)}50%{box-shadow:0 4px 26px rgba(236,72,153,.6)}}
h1{font-size:32px;letter-spacing:-.5px;background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac3),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
h2{font-size:17px}
.sub{color:var(--mut)}
.card,.stat{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(90,50,170,.12)}
.stat{transition:transform .25s,box-shadow .25s;border-top:4px solid var(--ac)}
.stat:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(90,50,170,.22)}
.stats .stat:nth-child(2){border-top-color:var(--ac2)}.stats .stat:nth-child(3){border-top-color:var(--ac3)}.stats .stat:nth-child(4){border-top-color:var(--warn)}.stats .stat:nth-child(5){border-top-color:var(--ok)}

nav{gap:8px}

nav button:hover,.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 8px 20px rgba(124,58,237,.3)}

nav button.on,.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac3));background-size:200% 200%;color:#fff;border-color:transparent}

.btn.pri{animation:pulse 2.4s ease-in-out infinite}
.btn.sm{border-radius:99px}
input,select,textarea{border-radius:12px;border:1px solid var(--bd);transition:box-shadow .2s,border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,58,237,.25)}
.tw table{border-collapse:separate;border-spacing:0 7px}
th{position:static;background:transparent;border-bottom:none;color:var(--ac);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:2px 10px;transition:color .2s}
th:hover{color:var(--ac2)}
td{background:rgba(124,58,237,.07);border-bottom:none;padding:9px 10px;transition:background .2s}
tr:hover td{background:rgba(236,72,153,.16)}
td:first-child{border-radius:14px 0 0 14px;font-weight:700;color:var(--ac)}
td:last-child{border-radius:0 14px 14px 0}

.tag{border-radius:99px;padding:2px 9px;font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
