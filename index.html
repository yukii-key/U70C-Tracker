  $('modal').innerHTML='<div class="modal" id="mbg"><div class="sheet"><button class="x" data-act="close" aria-label="Close">✕</button><div class="mh"><div class="av" style="background:'+col(id)+'">'+esc(ini(r.name))+'</div><div><h2>'+nm(r)+' '+am.map(function(a){return'<span title="'+a[2]+'">'+a[1]+'</span>'}).join('')+'</h2><span class="badge r-'+RK(r)+'">'+rl(RK(r))+'</span><span class="tier" style="color:'+t[1]+'">'+t[0]+'</span>'+(f.k?' '+chipFl(f.k):'')+' '+chipFl(kv.v)+'<div class="mut" style="font-size:12px;margin-top:4px">ID '+esc(id)+' <button class="btn sm" data-act="copyId:'+esc(id)+'">copy</button> · Last login '+esc(String(r.last).replace('T',' '))+' UTC ('+idleTxt(idle(r,c))+')</div></div></div>'+
   '<div class="kgrid"><div class="k"><span>Usefulness score</span><b>'+u+'%</b><small>#'+rankPos(s,r,'Usefulness %')+' of '+s.rows.length+'</small></div><div class="k"><span>Power</span><b>'+fmt(r.m['Power'])+'</b><small>#'+rankPos(s,r,'Power')+' of '+s.rows.length+'</small></div><div class="k"><span>KvK score</span><b>'+kv.sc+'/100</b><small>'+esc(kv.why.slice(0,2).join(' · '))+'</small></div></div>'+
   '<h2>Contributions</h2>'+bars+'<h2 style="margin-top:16px">All stats &amp; rankings</h2><div class="kgrid">'+k+'</div>'+hist+mg+'</div></div>'}
function closeM(){$('modal').innerHTML=''}
function openPal(){palSel=0;$('modal').innerHTML='<div class="modal" id="mbg"><div class="sheet pal"><input id="pq" data-i="pq" placeholder="Search member name or ID… (Enter to open)" autocomplete="off"><div id="pres" style="margin-top:8px"></div></div></div>';fillPal('');$('pq').focus()}
function palRows(q){var s=cur();q=q.toLowerCase().trim();return s?s.rows.filter(function(r){return!q||r.name.toLowerCase().indexOf(q)>=0||String(r.id).indexOf(q)>=0}).slice(0,8):[]}
function fillPal(q){var rows=palRows(q);if(palSel>=rows.length)palSel=0;$('pres').innerHTML=rows.length?rows.map(function(r,i){return'<div class="pr'+(i==palSel?' sel':'')+'" data-id="'+esc(r.id)+'"><div class="av" style="background:'+col(r.id)+';width:30px;height:30px;font-size:12px">'+esc(ini(r.name))+'</div><b style="flex:1">'+nm(r)+'</b><span class="badge r-'+RK(r)+'">'+rl(RK(r))+'</span></div>'}).join(''):'<div class="empty">No match</div>'}
/* ---------- data ops ---------- */
function parseCSV(t){var rows=[],r=[],c='',q=false;t=t.replace(/^﻿/,'');for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function snapFromCSV(text,date,label){var R=parseCSV(text);if(!R.length)throw new Error('Nothing to read – paste the CSV first.');var H=R[0].map(function(h){return h.trim()}),ix=function(n){return H.indexOf(n)};if(ix('ID')<0||ix('Player')<0)throw new Error('This does not look like the alliance activity CSV (need Player and ID columns).');
  var map={'Usefulness %':'Usefulness Score','Power':'Power','Forts destroyed':'Forts destroyed','Tech points':'Technology points','Alliance helps':'Alliance helps','Resource assistance':'Resource assistance','Armory points':'Armory points','Kill points':'Kill points','Gifts':'Gifts','Gift score':'Gift Score'},cols=Object.keys(map).concat(['Building time (h)']);
  var prev=cur(),pr={};if(prev)prev.rows.forEach(function(r){pr[r.id]=RK(r)});
  var rows=R.slice(1).filter(function(r){return r.length>3}).map(function(r){var m={};Object.keys(map).forEach(function(k){m[k]=ix(map[k])>=0?num(r[ix(map[k])])||0:0});m['Building time (h)']=ix('Building time (seconds)')>=0?Math.round(100*(num(r[ix('Building time (seconds)')])||0)/3600)/100:0;var id=r[ix('ID')].trim();return{id:id,name:r[ix('Player')],rank:pr[id]||'R1',last:ix('Last login')>=0?r[ix('Last login')].slice(0,19):'',m:m}});
  if(!rows.length)throw new Error('No member rows found.');return{date:date,label:label,cols:cols,rows:rows}}
function exportJson(){var json=JSON.stringify({info:S.info,snaps:allSnaps(),meta:M});window._json=json;try{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);a.download='data.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}msg='If no file downloaded, copy the text below into a file named data.json.';render()}
function dl(name,text,type){var b=new Blob([text],{type:type||'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function names(list){return list.map(function(r){return r.name}).join('\n')}
/* ---------- events ---------- */
function act(a,b){
  var p=a.split(':'),k=p[0],v=p[1],s=cur();
  switch(k){
   case'pal':openPal();break;
   case'theme':case'lang':pop=pop==k?null:k;renderTop();break;
   case'setTheme':setTheme(v);break;
   case'tab':tab=v;pop=null;render();window.scrollTo(0,0);break;
   case'f':F[v]=b.getAttribute('data-v');render();break;
   case'sort':F.sort=v;render();break;
   case'close':closeM();break;
   case'copyId':copyText(v,'ID copied ✓');break;
   case'copyNames':copyText(filtered(s).map(function(r){return r.name+' – '+r.id}).join('\n'),'Copied '+filtered(s).length+' names ✓');break;
   case'csv':var rows=filtered(s),h=['Name','ID','Rank'].concat(STATS.map(function(x){return x[1]})).concat(['Last login']);dl('u70c-roster.csv',[h].concat(rows.map(function(r){return[r.name,r.id,rl(RK(r))].concat(STATS.map(function(x){return r.m[x[0]]||0})).concat([r.last])})).map(function(r){return r.map(function(x){return'"'+String(x).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),'text/csv');break;
   case'copyKick':var c=ctx(s);copyText(s.rows.filter(function(r){return flag(r,s).k=='kick'}).map(function(r){return r.name+' ('+r.id+') – '+idleTxt(idle(r,c))+', usefulness '+(r.m['Usefulness %']||0)+'%'}).join('\n')||'Nobody','Kick list copied ✓');break;
   case'copyKvk':var KB=kvkAll(s);copyText(s.rows.map(function(r){return{r:r,k:KB[r.id]}}).filter(function(x){return x.k.v==v}).sort(function(a,b){return b.k.sc-a.k.sc}).map(function(x,i){return(i+1)+'. '+x.r.name}).join('\n'),'KvK list copied ✓');break;
   case'kv':var id=p[1],val=p[2],n=nt(id);setNote(id,{kvk:n.kvk==val?'':val});render();break;
   case'copyMsg':copyText(M.recruit.msgs[+v],'Recruitment message copied ✓');break;
   case'resetMsg':M.recruit.msgs[0]=DEFMSG;touch();render();toast('Reset to default');break;
   case'addTodo':var t=$('todoin').value.trim();if(t){M.todos.push({t:t,d:false});touch();render()}break;
   case'delTodo':M.todos.splice(+v,1);touch();render();break;
   case'addApp':var an=$('an').value.trim();if(an){M.recruit.apps.push({n:an,i:$('ai').value.trim(),p:$('ap').value,t:$('at').value.trim(),s:'pending'});touch();render()}break;
   case'delApp':M.recruit.apps.splice(+v,1);touch();render();break;
   case'addSnap':try{var d=$('date').value;if(!d)throw new Error('Pick a scan date.');var sn=snapFromCSV($('paste').value,d,$('label').value.trim());L.snaps.push(sn);if(saveLocal())msg='Saved '+sn.rows.length+' members.'}catch(e){msg=e.message}render();break;
   case'delSnap':if(+v>=0&&confirm('Delete this snapshot?')){L.snaps.splice(+v,1);saveLocal();render()}break;
   case'exp':exportJson();break;
   case'reset':if(confirm('Discard everything saved in this browser (notes, ranks, snapshots you added)?')){L={snaps:[],meta:null};saveLocal();M=buildMeta();render()}break;
   case'unlock':sha($('pw').value).then(function(h){if(h==S.info.lock){try{localStorage.setItem('u70c.ok',h)}catch(e){}render()}else $('lmsg').textContent='Wrong passcode'}).catch(function(){$('lmsg').textContent='Lock needs a secure (https) page'});break;
   case'setLock':var pw=$('newpw').value;if(!pw){msg='Type a passcode first.';render();break}sha(pw).then(function(h){S.info.lock=h;try{localStorage.setItem('u70c.ok',h)}catch(e){}msg='Passcode set. Export data.json and upload it to GitHub to make it live.';render()}).catch(function(){msg='Passcode needs a secure (https) page.';render()});break;
   case'rmLock':delete S.info.lock;msg='Passcode removed. Export and upload data.json to apply.';render();break;
  }}
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var a=t.closest('[data-act]');if(a){e.stopPropagation();act(a.getAttribute('data-act'),a);return}
  if(pop&&!t.closest('#tools')){pop=null;renderTop()}
  if(t.id=='mbg'){closeM();return}
  var r=t.closest('[data-id]');if(r&&!t.closest('input,select,textarea,button'))openMember(r.getAttribute('data-id'))});
document.addEventListener('input',function(e){var t=e.target,i=t.getAttribute&&t.getAttribute('data-i');
  if(i=='q'){F.q=t.value;var p=t.selectionStart;render();var n=$('q');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(x){}}}
  else if(i=='pq'){palSel=0;fillPal(t.value)}
  else if(t.getAttribute&&t.getAttribute('data-msg')!=null){var k=+t.getAttribute('data-msg');M.recruit.msgs[k]=t.value;touch();$('cc'+k).textContent=t.value.length+' characters'}
  else if(t.getAttribute&&t.getAttribute('data-nf')=='note'){setNote(t.getAttribute('data-nid'),{note:t.value})}});
document.addEventListener('change',function(e){var t=e.target,g=function(x){return t.getAttribute&&t.getAttribute(x)},i=g('data-i');
  if(i=='sort'){F.sort=t.value;render()}
  else if(i=='lang'){setLang(t.value)}
  else if(i=='tm'){window._tm=+t.value;render()}
  else if(i=='tmem'){window._tmem=t.value;render()}
  else if(i=='tst'){window._tst=t.value;render()}
  else if(i=='imp'){var f=t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o.snaps)throw 0;S={info:o.info||S.info,snaps:o.snaps,meta:o.meta||null};L={snaps:[],meta:null};saveLocal();M=buildMeta();msg='Backup restored.'}catch(x){msg='That file is not a valid backup.'}render()};rd.readAsText(f)}
  else if(g('data-cfg')){var key=g('data-cfg'),v=parseFloat(t.value);if(!isNaN(v)){M.cfg[key]=v*(+g('data-mult')||1);touch();render()}}
  else if(g('data-nf')&&g('data-nf')!='note'){var id=g('data-nid'),f2=g('data-nf');if(f2=='rank'){M.ranks[id]=t.value;touch()}else{var pa={};pa[f2]=t.value;setNote(id,pa)}render();openMember(id)}
  else if(g('data-todo')!=null){M.todos[+g('data-todo')].d=t.checked;touch();render()}
  else if(g('data-app')!=null){M.recruit.apps[+g('data-app')].s=t.value;touch()}});
document.addEventListener('keydown',function(e){
  var tg=e.target,typing=tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName);
  if(e.key=='Escape'){closeM();pop=null;renderTop();return}
  if($('pq')&&document.activeElement==$('pq')){var rows=palRows($('pq').value);if(e.key=='ArrowDown'){palSel=Math.min(rows.length-1,palSel+1);fillPal($('pq').value);e.preventDefault()}else if(e.key=='ArrowUp'){palSel=Math.max(0,palSel-1);fillPal($('pq').value);e.preventDefault()}else if(e.key=='Enter'&&rows[palSel])openMember(rows[palSel].id);return}
  if(e.key=='Enter'&&tg&&tg.id=='pw'){act('unlock',tg);return}
  if(e.key=='Enter'&&tg&&tg.id=='todoin'){act('addTodo',tg);return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key=='/'||(e.key=='k'&&false)){e.preventDefault();openPal()}
  else if(/^[1-7]$/.test(e.key)&&!booting&&!isLocked()){tab=TABS[+e.key-1][0];render();window.scrollTo(0,0)}});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key=='k'){e.preventDefault();openPal()}});
function loadShared(){var done=function(){if(booting){booting=false;M=buildMeta();render()}};try{fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(o){if(o&&o.snaps&&o.snaps.length)S={info:o.info||S.info,snaps:o.snaps,meta:o.meta||null};done()}).catch(done)}catch(e){done()}setTimeout(done,3500)}
$('bl').src=LOGO;document.querySelector('link[rel=icon]').href=LOGO;
loadLocal();M=buildMeta();render();loadShared();loadTranslate();
</script>
