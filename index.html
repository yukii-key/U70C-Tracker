<style>
:root{--bg:#f3f1fb;--bg2:#fff;--card:#fff;--card2:#f0edfa;--bd:#ddd6f3;--tx:#1c1838;--mut:#6a6490;--ac:#7c3aed;--ac2:#ec4899;--ac3:#0891b2;--ok:#16a34a;--bad:#e11d48;--warn:#d97706;--gold:#b7791f;--btx:#fff;--shadow:0 6px 24px rgba(80,50,160,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme]),:root[data-theme="auto"]{--bg:#0b0a14;--bg2:#100e1d;--card:#15132a;--card2:#1c1938;--bd:#2b2750;--tx:#ece9ff;--mut:#9a95c4;--ac:#a78bfa;--ac2:#f472b6;--ac3:#22d3ee;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#14092e;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="chaos"]{--bg:#0b0a14;--bg2:#100e1d;--card:#15132a;--card2:#1c1938;--bd:#2b2750;--tx:#ece9ff;--mut:#9a95c4;--ac:#a78bfa;--ac2:#f472b6;--ac3:#22d3ee;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#14092e;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme="midnight"]{--bg:#05070d;--bg2:#0a0f1a;--card:#0e1524;--card2:#152036;--bd:#1f2d4a;--tx:#e6edf8;--mut:#8ea0bf;--ac:#3b82f6;--ac2:#8b5cf6;--ac3:#22d3ee;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#fff;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="sakura"]{--bg:#fff1f5;--bg2:#fff;--card:#fff;--card2:#ffe4ec;--bd:#f9c9d8;--tx:#3a1224;--mut:#96607a;--ac:#db2777;--ac2:#f472b6;--ac3:#ea580c;--ok:#15803d;--bad:#be123c;--warn:#c2410c;--gold:#b45309;--btx:#fff;--shadow:0 6px 24px rgba(219,39,119,.12);color-scheme:light}
:root[data-theme="forest"]{--bg:#08130d;--bg2:#0c1a12;--card:#102419;--card2:#16311f;--bd:#23452f;--tx:#e5f6ea;--mut:#8fb59d;--ac:#22c55e;--ac2:#a3e635;--ac3:#2dd4bf;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#04210f;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
:root[data-theme="royal"]{--bg:#0e0b05;--bg2:#15110a;--card:#1c160b;--card2:#261e0f;--bd:#3d3016;--tx:#faf3df;--mut:#b9a87a;--ac:#f59e0b;--ac2:#ef4444;--ac3:#fde047;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#1a1100;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme="ocean"]{--bg:#eaf6fb;--bg2:#fff;--card:#fff;--card2:#e0f0f8;--bd:#bcdcec;--tx:#0c2a3a;--mut:#4f7a90;--ac:#0284c7;--ac2:#06b6d4;--ac3:#6366f1;--ok:#15803d;--bad:#be123c;--warn:#b45309;--gold:#a16207;--btx:#fff;--shadow:0 6px 24px rgba(2,132,199,.12);color-scheme:light}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 400px at 0% 0%,color-mix(in srgb,var(--ac) 20%,transparent),transparent 70%),radial-gradient(600px 400px at 100% 0%,color-mix(in srgb,var(--ac2) 14%,transparent),transparent 70%);z-index:0}
body.top{top:0!important}.skiptranslate iframe,.goog-te-banner-frame{display:none!important}body{top:0!important}#goog-gt-tt{display:none!important}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.bar{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.brand img{height:40px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.brand small{display:block;font-size:11px;color:var(--mut);font-weight:600;letter-spacing:.3px}
nav{display:flex;gap:2px;margin-left:auto}
nav button{background:transparent;color:var(--mut);border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
nav button:hover{color:var(--tx);background:var(--card2)}
nav button.on{color:var(--btx);background:linear-gradient(135deg,var(--ac),var(--ac2))}
#tools{display:flex;gap:6px;position:relative}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:16px;transition:.15s}
.ib:hover{border-color:var(--ac);transform:translateY(-1px)}
.pop{position:absolute;right:0;top:46px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:12px;width:min(330px,88vw);box-shadow:var(--shadow);z-index:60}
.pop h4{margin:0 0 8px;font-size:13px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw button{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sw button.on{outline:2px solid var(--ac)}
.sw i{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.hero{margin:22px 0 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac2) 30%,transparent),transparent 70%);pointer-events:none}
.hero img{height:118px;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1{margin:0;font-size:30px;letter-spacing:-.6px;line-height:1.15}
.hero h1 small{font-size:15px;color:var(--ac);font-weight:700;margin-left:6px}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card2);color:var(--mut);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;border-top:3px solid var(--ac);box-shadow:var(--shadow);transition:.2s}
.stat:hover{transform:translateY(-3px)}
.stat:nth-child(2){border-top-color:var(--ac2)}.stat:nth-child(3){border-top-color:var(--ac3)}.stat:nth-child(4){border-top-color:var(--warn)}.stat:nth-child(5){border-top-color:var(--ok)}.stat:nth-child(6){border-top-color:var(--bad)}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.2px}h2 small{font-weight:500;color:var(--mut);font-size:12px;margin-left:6px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.lb li:last-child{border:0}.lb li:hover{background:var(--card2)}
.pos{width:22px;text-align:center;font-weight:800;color:var(--mut)}
.lb li:nth-child(1) .pos{color:var(--gold)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .vl{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;color:#fff;letter-spacing:.3px}
.r-Leader{background:linear-gradient(135deg,#d97706,#f59e0b)}.r-R4{background:#2563eb}.r-R3{background:#7c3aed}.r-R2{background:#0891b2}.r-R1{background:#64748b}
.fl{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.fl-kick,.fl-skip{color:var(--bad)}.fl-warn,.fl-maybe{color:var(--warn)}.fl-watch{color:var(--ac3)}.fl-go{color:var(--ok)}.fl-up{color:var(--ok)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.aw{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.15s}
.aw:hover{transform:translateY(-2px);border-color:var(--ac)}
.aw .e{font-size:26px}.aw b{display:block;font-size:13px}.aw span{font-size:12px;color:var(--mut)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .f{flex:1;min-width:220px}
.filters label,.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:4px;font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.seg button:hover,.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.seg button.on,.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--btx);border-color:transparent}
.btn.sm{padding:3px 10px;font-size:12px}.btn.bad{color:var(--bad)}.btn.ok{color:var(--ok)}

:root[data-theme="banner"]{--bg:#12060b;--bg2:#1a0a10;--card:#220c14;--card2:#2d111c;--bd:#4a1c2c;--tx:#fff0f2;--mut:#c9969f;--ac:#ef4444;--ac2:#f59e0b;--ac3:#60a5fa;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--btx:#fff;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}

@keyframes popin{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}

@keyframes ang{to{--ang:360deg}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes tk{to{transform:translateX(-50%)}}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.08)}}
@keyframes ringin{from{stroke-dashoffset:var(--c)}}

@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes blink{50%{opacity:.35}}

@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}

/* grids */
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-bottom:16px}.grid2>.card{margin-bottom:0}.stackc{display:grid;gap:16px;align-content:start}.stackc>.card{margin:0}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}.hero h1.grad{font-size:28px}.logo3d{width:140px;height:140px}.logo3d .hl,.hero .logo3d img{height:124px}}
/* charter */
.charter{overflow:hidden;text-align:center;border-color:color-mix(in srgb,var(--ac2) 50%,var(--bd))}
.ch-sun{position:absolute;left:50%;top:-40px;width:420px;height:420px;margin-left:-210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--ac2) 14%,transparent) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 62%);mask:radial-gradient(circle,#000 5%,transparent 62%);animation:spin 60s linear infinite;pointer-events:none}
.ch-top,.ch-roles,.ch-reqs,.charter .row,.ch-h{position:relative}
.ch-title{font-size:34px;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#fff2b0,var(--gold) 55%,#b7791f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px color-mix(in srgb,var(--gold) 45%,transparent))}
.ch-title .st{font-style:normal;margin:0 8px;display:inline-block;animation:spin 6s linear infinite}
.ch-name{font-size:21px;font-weight:800;margin-top:2px}.tg{color:var(--ac)}
.ch-fam{font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.ch-motto{display:inline-block;margin:12px 0 4px;padding:5px 22px;font-size:24px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;border-radius:99px;color:var(--btx);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 22px color-mix(in srgb,var(--ac) 40%,transparent)}
.ch-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px;text-align:left}
.ch-role{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:9px 12px}.ch-role .ri{font-size:24px}.ch-role small{display:block;font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}.ch-role b{font-size:14px}
.ch-h{margin:16px 0 8px;font-size:15px}
.ch-reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ch-req{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700;border-radius:14px;padding:10px 12px;border:1px dashed color-mix(in srgb,var(--ac2) 60%,var(--bd));background:color-mix(in srgb,var(--ac2) 8%,var(--card2));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.ch-req:hover{transform:translateY(-3px) rotate(-1deg)}.ch-req span{font-size:20px}
.charter .row{justify-content:center}
/* spotlight */
.spot{overflow:hidden;cursor:pointer;background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--card) 85%,var(--ac2)))}
.spot .eyebrow{margin-bottom:10px;color:var(--gold)}
.spot-in{display:flex;gap:16px;align-items:center}.spot-in h3{margin:0 0 4px;font-size:20px;overflow:hidden;text-overflow:ellipsis}
.spot-av{position:relative;flex:none}.halo{position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac3),var(--ac));animation:spin 5s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);opacity:.9}
.spot-k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.spot-k div{background:var(--card2);border-radius:12px;padding:7px 6px;text-align:center}.spot-k b{display:block;font-size:15px}.spot-k span{font-size:10.5px;color:var(--mut)}
/* rings */
.ring{position:relative;flex:none}.ring svg{width:100%;height:100%;display:block}.ring .bg{fill:none;stroke:var(--card2);stroke-width:8}.ring .fg{fill:none;stroke:var(--col);stroke-width:8;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--o);transform:rotate(-90deg);transform-origin:40px 40px;filter:drop-shadow(0 0 4px var(--col))}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}.ring .rt b{font-size:22px}.ring .rt span{font-size:10px;color:var(--mut);letter-spacing:.1em;font-weight:700}
#view.anim .ring .fg,.sheet.fresh .ring .fg,.sheet.swl .ring .fg,.sheet.swr .ring .fg{animation:ringin 1.4s cubic-bezier(.2,.8,.2,1) .25s backwards}
.rings{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px}.rg{text-align:center}.rg em{display:block;font-style:normal;font-size:12px;color:var(--mut);font-weight:600;margin-top:4px}
/* podium */
.pods{margin-bottom:6px}.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:26px 6px 0;min-height:250px}
.pcol{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(30%,170px);cursor:pointer;position:relative}.pcol>b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.pcol .pv{font-weight:900;color:var(--ac);font-size:16px}
.pcol .crown{font-size:26px;animation:float 2.6s ease-in-out infinite;margin-bottom:-6px}
.pbar{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font-size:28px;transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.9,.3,1.1) backwards}
.p1 .pbar{background:linear-gradient(180deg,#fcd34d,#b7791f);animation-delay:.35s}.p2 .pbar{background:linear-gradient(180deg,#e5e7eb,#7b8494);animation-delay:.15s}.p3 .pbar{background:linear-gradient(180deg,#f0a766,#8a4b1f);animation-delay:.05s}
.pcol:hover .av{transform:scale(1.1)}
/* hub */
.pagehead{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,var(--card)),var(--card))}
.lks{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.lk{display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.3,1.4,.5,1),border-color .2s;overflow:hidden}
.lk:hover{transform:translateY(-4px);border-color:var(--ac)}
.lk-ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 40%,transparent);animation:float 4s ease-in-out infinite}
.lk.discord .lk-ic{background:linear-gradient(135deg,#5865f2,#7983f5);box-shadow:0 8px 22px rgba(88,101,242,.45)}.lk.ban .lk-ic{background:linear-gradient(135deg,#e11d48,#f97316)}
.lk h3{margin:0 0 2px;font-size:17px}.lk p{margin:0;color:var(--mut);font-size:13px}.lk-u{font-size:12px;color:var(--ac);margin-top:6px;word-break:break-all;font-weight:600}.lk-b{min-width:0;flex:1}
.bigclock{font:900 40px ui-monospace,Menlo,Consolas,monospace;color:var(--ac);letter-spacing:.04em}.clockc .row>div{min-width:100px}
.qc{display:grid;gap:8px}.qc .btn{justify-content:flex-start}
.steps{margin:0;padding-left:20px;color:var(--mut);font-size:13.5px;display:grid;gap:4px}.steps b{color:var(--tx)}
/* duel */
.dsel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:6px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:16px 0 6px}
.fighter{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;padding:12px 6px;border-radius:20px;transition:transform .3s cubic-bezier(.3,1.5,.5,1),background .3s}.fighter:hover{transform:translateY(-4px)}
#view.anim .fighter.a{animation:fromL .8s cubic-bezier(.2,.8,.2,1) backwards}#view.anim .fighter.b{animation:fromR .8s cubic-bezier(.2,.8,.2,1) backwards}
.fighter h3{margin:2px 0 0;font-size:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter.win{background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 70%)}.fighter.win .av{box-shadow:0 0 0 3px var(--gold),0 0 30px color-mix(in srgb,var(--gold) 60%,transparent)}
.fighter .crown{position:absolute;top:-14px;font-size:30px;animation:float 2.4s ease-in-out infinite;z-index:2}
.vs{text-align:center}.vsb{font-size:30px;font-weight:900;font-style:italic;color:var(--btx);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 28px color-mix(in srgb,var(--ac) 50%,transparent)}
#view.anim .vsb{animation:vsin .9s .3s cubic-bezier(.2,.8,.2,1) backwards}
.score{font-size:30px;font-weight:900;display:flex;gap:8px;justify-content:center;align-items:center}.score span{color:var(--mut)}.score b.up{color:var(--ok)}
.dverdict{text-align:center;font-size:17px;margin:6px 0 14px;padding:10px;border-radius:14px;background:var(--card2)}
.drows{display:grid;gap:8px}.dr{display:grid;grid-template-columns:1fr 150px 1fr;gap:10px;align-items:center}
.dl{text-align:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.dv{position:relative;height:30px;border-radius:9px;background:var(--card2);overflow:hidden;display:flex;align-items:center;padding:0 10px;font-size:13px}
.dv i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.4}.dv.l i{right:0;transform-origin:right}.dv.r i{left:0;transform-origin:left}.dv.l{justify-content:flex-start}.dv.r{justify-content:flex-end}
.dv.l i{background:linear-gradient(270deg,var(--ac),var(--ac2))}.dv.r i{background:linear-gradient(90deg,var(--ac3),var(--ac))}
.dv.w i{opacity:.95;box-shadow:0 0 16px color-mix(in srgb,var(--ac2) 60%,transparent)}.dv.w b{color:var(--btx);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.dv b{position:relative;z-index:1;font-variant-numeric:tabular-nums}
#view.anim .dv i{animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.45s + var(--md,0ms))}
@media (max-width:640px){.dr{grid-template-columns:1fr 1fr}.dl{grid-column:1/-1;order:-1;text-align:left}.arena{grid-template-columns:1fr 1fr}.vs{grid-column:1/-1;order:3}.dsel{grid-template-columns:1fr}.dsel .btn{justify-self:center}.score{font-size:22px}}
/* modal / profile */
.modal{animation:fade .25s both}.modal.still{animation:none}.modal.out{animation:fadeout .18s both}
.sheet{animation:popin .5s cubic-bezier(.2,1.1,.3,1) both}.modal.still .sheet{animation:none}.modal.still .sheet.swl{animation:slideL .4s cubic-bezier(.2,.8,.2,1) both}.modal.still .sheet.swr{animation:slideR .4s cubic-bezier(.2,.8,.2,1) both}.modal.out .sheet{animation:popout .18s both}
.sheet.prof{max-width:880px;padding:0 20px 24px;overflow:hidden}
.x{z-index:6;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s}.x:hover{transform:rotate(90deg) scale(1.1);background:var(--bad);color:#fff}
.pnav{position:absolute;left:14px;top:12px;z-index:6;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg2) 70%,transparent);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:99px;padding:2px 4px;font-size:12px;font-weight:700}
.pnav button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--tx);font-size:20px;line-height:1;cursor:pointer;transition:background .15s,transform .2s}.pnav button:hover{background:var(--ac);color:var(--btx);transform:scale(1.12)}
.pbanner{position:relative;margin:0 -20px 12px;padding:58px 24px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:radial-gradient(circle at 18% 20%,hsl(var(--h),70%,52%),hsl(calc(var(--h) + 50),60%,22%) 80%);overflow:hidden;color:#fff}
.pb-rays{position:absolute;left:-60px;top:-80px;width:360px;height:360px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.14) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:spin 50s linear infinite}
.pb-av{position:relative;flex:none;z-index:1}.pb-info{flex:1;min-width:220px;position:relative;z-index:1}.pb-info h2{margin:0 0 6px;font-size:26px;text-shadow:0 2px 10px rgba(0,0,0,.4);padding:0;overflow-wrap:anywhere}
.pb-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pb-badges .tier{margin:0;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25);color:#fff}.pb-badges .fl{background:rgba(0,0,0,.28);color:#fff}
.pb-meta{font-size:12px;opacity:.85;margin-top:8px}
.pb-lvl{position:relative;z-index:1;text-align:center}.pb-lvl em{display:block;font-style:normal;font-weight:800;font-size:12px;margin-top:2px}.pb-lvl .ring .bg{stroke:rgba(0,0,0,.3)}.pb-lvl .ring .rt b{color:#fff}.pb-lvl .ring .rt span{color:rgba(255,255,255,.75)}.pb-lvl .ring{--col:#fde68a!important}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pins{background:var(--card2);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:12px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.pcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px}
@media (max-width:700px){.pgrid{grid-template-columns:1fr}.pbanner{padding-top:60px}}
.ph{font-size:15px;margin:20px 0 10px;display:flex;align-items:baseline;gap:6px}.ph small{font-weight:500;color:var(--mut);font-size:11.5px}
.radar{width:100%;max-width:320px;display:block;margin:0 auto}.radar text{fill:var(--mut);font-size:11px;font-weight:700;font-family:inherit}
.radar .rd{transform-origin:150px 140px}.sheet.fresh .radar .rd,.sheet.swl .radar .rd,.sheet.swr .radar .rd{animation:radarin 1s .2s cubic-bezier(.2,.9,.3,1.1) backwards}
.chip.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--bd));background:color-mix(in srgb,var(--ok) 10%,var(--card2))}.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--bd));background:color-mix(in srgb,var(--bad) 8%,var(--card2))}
.sr{margin:0 0 12px}.sh{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}.sh b{font-variant-numeric:tabular-nums}.sr small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px}
.achh{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--mut);margin-bottom:10px}.achh .meter{flex:1}.achh b{color:var(--ac);font-size:20px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ach .a{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:10px 8px;text-align:center;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}.ach .a span{font-size:28px;display:block}.ach .a b{display:block;font-size:12.5px}.ach .a small{display:block;font-size:10.5px;color:var(--mut)}
.ach .a.on{border-color:color-mix(in srgb,var(--gold) 55%,var(--bd));background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 14%,var(--card2)),var(--card2))}.ach .a.on:hover{transform:translateY(-4px) rotate(-2deg)}
.ach .a.off{opacity:.38;filter:grayscale(1)}
.sheet.fresh .ach .a.on,.sheet.swl .ach .a.on,.sheet.swr .ach .a.on{animation:unlock .6s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(.4s + var(--md,0ms))}
.picrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.kr .av,.lb .av{margin-right:0}
.pr{transition:background .15s,transform .2s}.pr:hover{transform:translateX(3px)}
/* confetti + toast */
.conf{position:fixed;left:0;top:0;pointer-events:none;z-index:300;font-size:22px}
#toast{border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:.4s cubic-bezier(.3,1.5,.5,1)}
.lock img{height:150px}
footer a{color:var(--mut)}footer a:hover{color:var(--ac)}
.empty{animation:fade .5s both}
@media (prefers-reduced-motion:reduce){#splash{display:none}.tk-in{animation:none}}
.wmap{width:100%;height:auto;display:block}.wmap .land polygon{fill:var(--card2);stroke:var(--bd);stroke-width:.8}.wmap circle{stroke:var(--card);stroke-width:1;cursor:pointer}.wmap circle:hover{r:5.5}.wmap text{font-size:9px;font-weight:700;fill:var(--tx);paint-order:stroke;stroke:var(--card);stroke-width:2.5px;text-anchor:middle}
.mapbox{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px}.rt{border:1px solid var(--bd);border-left:4px solid var(--rc);border-radius:10px;padding:8px 10px;background:var(--card2);cursor:pointer}.rt b{display:block}.rt span{font-size:12px;color:var(--mut)}
.rgc{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--rc) 22%,transparent);border:1px solid var(--rc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .dh{font-size:11px;color:var(--mut);text-align:center}.cal .d{min-height:56px;border:1px solid var(--bd);border-radius:8px;padding:3px 4px;font-size:12px;background:var(--card2);overflow:hidden}.cal .d.t{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.cal .d.e{background:color-mix(in srgb,var(--ac) 14%,var(--card2))}.cal .d i{display:block;font-style:normal;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media(max-width:800px){.calwrap{grid-template-columns:1fr}}.up,.lg{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.up .ic{font-size:22px}.up b{display:block}.up small{display:block;color:var(--mut)}
.cov{display:flex;align-items:flex-end;gap:3px;height:90px}.cov i{flex:1;background:var(--bd);border-radius:3px 3px 0 0}.cov i.hi{background:var(--ok)}.covl{display:flex;gap:3px;font-size:10px;color:var(--mut)}.covl span{flex:1;text-align:center}.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin:8px 0}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.hof.strip{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.hf{margin:0;border:1px solid var(--bd);border-radius:14px;background:var(--card);overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.12)}.hf .hi{aspect-ratio:16/10;overflow:hidden;cursor:zoom-in;background:var(--card2)}.hf img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.hf .hi:hover img{transform:scale(1.05)}.hf figcaption{padding:10px 12px}.hf figcaption b,.hf figcaption small,.hf figcaption span{display:block}.hf figcaption small,.hf figcaption span{color:var(--mut);font-size:12px}
.hlb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}.hlb img{max-width:100%;max-height:80vh;border-radius:10px}.hlb .cap{color:#fff;text-align:center;max-width:700px}
.hdrop{flex:1;min-width:260px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px dashed var(--bd);border-radius:16px;padding:16px 18px;background:rgba(124,58,237,.05);transition:border-color .2s,background .2s,transform .2s}
.hdrop:hover{border-color:var(--ac)}.hdrop.over{border-color:var(--ac);background:rgba(124,58,237,.18);transform:scale(1.01)}
.hd-ic{font-size:30px}.hd-t{flex:1;min-width:200px;color:var(--mut)}.hd-t b{color:var(--tx)}
.hdrop kbd{border:1px solid var(--bd);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:12px ui-monospace,Menlo,monospace;color:var(--tx)}
body.hofdrag::after{content:"📸 Drop to add to the Hall of Fame";position:fixed;inset:12px;border:3px dashed var(--ac);border-radius:22px;background:rgba(124,58,237,.2);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;z-index:90;pointer-events:none;backdrop-filter:blur(2px)}
/* ---------- login / view-only ---------- */
.ib.adm{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 30%,transparent)}
