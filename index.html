<style>

:root[data-theme="dark"]{--bg:#0b0a14;--bg2:#100e1d;--card:#15132a;--card2:#1c1938;--bd:#2b2750;--tx:#ece9ff;--mut:#9a95c4;--ac:#a78bfa;--ac2:#f472b6;--ac3:#22d3ee;--ok:#4ade80;--bad:#fb7185;--warn:#fbbf24;--gold:#fcd34d;--shadow:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 400px at 0% 0%,rgba(124,58,237,.18),transparent 70%),radial-gradient(600px 400px at 100% 0%,rgba(236,72,153,.12),transparent 70%);z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding-top:env(safe-area-inset-top,0)}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2),var(--ac3));display:grid;place-items:center;color:#fff;font-size:14px;font-weight:900;box-shadow:var(--shadow)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;color:var(--mut);border:0;border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
nav button:hover{color:var(--tx);background:var(--card2)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.hero{margin:22px 0 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.crest{width:96px;height:96px;border-radius:22px;background:linear-gradient(160deg,#1d4ed8,#0ea5e9);display:grid;place-items:center;font-size:44px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),var(--shadow)}
.hero h1{margin:0;font-size:30px;letter-spacing:-.6px;line-height:1.15}
.hero h1 small{font-size:15px;color:var(--ac);font-weight:700;margin-left:6px}
.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card2);color:var(--mut);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;border-top:3px solid var(--ac);box-shadow:var(--shadow)}
.stat:nth-child(2){border-top-color:var(--ac2)}.stat:nth-child(3){border-top-color:var(--ac3)}.stat:nth-child(4){border-top-color:var(--warn)}.stat:nth-child(5){border-top-color:var(--ok)}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0 0 12px;letter-spacing:-.2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}
.lb li:last-child{border:0}.lb li:hover{background:var(--card2)}
.pos{width:22px;text-align:center;font-weight:800;color:var(--mut)}
.lb li:nth-child(1) .pos{color:var(--gold)}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .vl{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:700}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:7px;color:#fff;letter-spacing:.3px}
.r-Leader{background:linear-gradient(135deg,#d97706,#f59e0b)}.r-R4{background:#2563eb}.r-R3{background:#7c3aed}.r-R2{background:#0891b2}.r-R1{background:#64748b}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filters .f{flex:1;min-width:220px}
.filters label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin-bottom:4px;font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:99px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.seg button:hover,.btn:hover{border-color:var(--ac);transform:translateY(-1px)}
.seg button.on,.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
input,select,textarea{width:100%;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea{min-height:140px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.group{margin-bottom:20px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 10px;cursor:pointer;user-select:none}
.ghead h3{margin:0;font-size:16px}.ghead .n{color:var(--mut);font-size:13px}.ghead .ln{flex:1;height:1px;background:var(--bd)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;cursor:pointer;transition:.15s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}

.mc .t{display:flex;gap:10px;align-items:center}
.mc .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .id{font-size:11px;color:var(--mut)}
.mc .kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px;color:var(--mut)}
.mc .kv b{color:var(--tx);font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{cursor:pointer;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--card)}

tbody tr{cursor:pointer}tbody tr:hover td{background:var(--card2)}

.empty{color:var(--mut);padding:28px;text-align:center}

.x{position:absolute;right:14px;top:12px;background:var(--card2);border:0;color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.mh{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-right:40px}

.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}

.k b{font-size:18px;font-variant-numeric:tabular-nums}
.k small{display:block;color:var(--mut);font-size:11px}
.crow{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;margin:8px 0;font-size:13px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}.row>div{flex:1;min-width:150px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

  else if(F.view=='table'){body='<div class="card tw"><table><thead><tr><th>#</th><th>Name</th><th>Rank</th>'+STATS.map(function(x){return'<th data-sort="'+esc(x[0])+'">'+x[1]+(F.sort==x[0]?' ▾':'')+'</th>'}).join('')+'<th>Last seen</th></tr></thead><tbody>'+rows.map(function(r,i){return'<tr data-id="'+esc(r.id)+'"><td>'+(i+1)+'</td><td><b>'+esc(r.name)+'</b></td><td><span class="badge r-'+r.rank+'">'+r.rank+'</span></td>'+STATS.map(function(x){return'<td>'+(x[0]=='Usefulness %'?r.m[x[0]]+'%':x[0]=='Building time (h)'?(r.m[x[0]]||0).toFixed(1):sh(r.m[x[0]]))+'</td>'}).join('')+'<td class="'+((idle(r,c)||0)>=2?'warn':'')+'">'+idleTxt(idle(r,c))+'</td></tr>'}).join('')+'</tbody></table></div>'}
  else body=RANKS.map(function(rk){var g=rows.filter(function(r){return r.rank==rk});if(!g.length)return'';return'<div class="group"><div class="ghead"><span class="badge r-'+rk+'">'+rk+'</span><h3>'+RN[rk]+'</h3><span class="n">'+g.length+' member'+(g.length>1?'s':'')+'</span><span class="ln"></span></div><div class="mgrid">'+g.map(function(r){return card(r,s,c)}).join('')+'</div></div>'}).join('');
  return f+'<p class="mut" style="font-size:13px;margin:0 0 12px">Showing '+rows.length+' of '+s.rows.length+' members. Tap anyone to see their full details.</p>'+body;
}
function openMember(id){
  var s=cur(),r=s.rows.filter(function(x){return x.id==id})[0];if(!r)return;
  var c=ctx(s),u=r.m['Usefulness %']||0,t=tier(u),hist='';
  var prev=allSnaps().filter(function(x){return x!==s&&x.date<s.date}).pop(),p=prev&&prev.rows.filter(function(x){return x.id==id})[0];
  var k=STATS.filter(function(x){return x[0]!='Usefulness %'}).map(function(x){var v=r.m[x[0]]||0,pos=rankPos(s,r,x[0]);return'<div class="k"><span>'+x[1]+'</span><b>'+(x[2]=='h'?v.toFixed(1)+' h':fmt(v))+'</b><small>#'+pos+' of '+s.rows.length+'</small></div>'}).join('');
  var bars=['Forts destroyed','Alliance helps','Tech points','Armory points','Building time (h)','Resource assistance'].map(function(cn){var v=r.m[cn]||0,mx=c.mx[cn]||1,l=STATS.filter(function(x){return x[0]==cn})[0][1];return'<div class="crow"><span>'+l+'</span><div class="meter"><i style="width:'+Math.min(100,100*v/mx)+'%"></i></div><em>'+Math.round(100*v/mx)+'% of top</em></div>'}).join('');
  if(p)hist='<h2 style="margin-top:16px">Change since '+esc(prev.date)+'</h2><div class="kgrid">'+['Power','Forts destroyed','Alliance helps','Tech points','Kill points'].map(function(cn){var d=(r.m[cn]||0)-(p.m[cn]||0);return'<div class="k"><span>'+cn+'</span><b class="'+(d>0?'up':d<0?'dn':'')+'">'+fd(d)+'</b></div>'}).join('')+'</div>';
  $('modal').innerHTML='<div class="modal" id="mbg"><div class="sheet"><button class="x" id="mx" aria-label="Close">✕</button><div class="mh"><div class="av" style="background:'+col(r.id)+'">'+esc(ini(r.name))+'</div><div><h2>'+esc(r.name)+'</h2><span class="badge r-'+r.rank+'">'+r.rank+'</span><span class="tier" style="color:'+t[1]+'">'+t[0]+'</span><div class="mut" style="font-size:12px;margin-top:4px">Governor ID '+esc(r.id)+' · Last login '+esc(r.last.replace('T',' '))+' UTC ('+idleTxt(idle(r,c))+')</div></div></div>'+
   '<div class="kgrid"><div class="k"><span>Usefulness score</span><b>'+u+'%</b><small>#'+rankPos(s,r,'Usefulness %')+' of '+s.rows.length+'</small></div><div class="k"><span>Power</span><b>'+fmt(r.m['Power'])+'</b><small>#'+rankPos(s,r,'Power')+' of '+s.rows.length+'</small></div></div>'+
   '<h2>Contributions</h2>'+bars+'<h2 style="margin-top:16px">All stats &amp; rankings</h2><div class="kgrid">'+k+'</div>'+hist+'</div></div>';
  $('mx').onclick=closeM;$('mbg').onclick=function(e){if(e.target.id=='mbg')closeM()};
}
function closeM(){$('modal').innerHTML=''}
document.addEventListener('keydown',function(e){if(e.key=='Escape')closeM()});
function changesView(){
  var ss=allSnaps();if(ss.length<2)return'<div class="card empty">Save at least two snapshots (Data tab) to compare growth and see who has gone quiet.</div>';
  var bi=window._cb!=null&&ss[window._cb]?window._cb:ss.length-1,ai=window._ca!=null&&ss[window._ca]?window._ca:ss.length-2,A=ss[ai],B=ss[bi];
  var cols=B.cols.filter(function(x){return A.cols.indexOf(x)>=0&&x!='Usefulness %'}),am=window._am&&cols.indexOf(window._am)>=0?window._am:(cols.indexOf('Alliance helps')>=0?'Alliance helps':cols[0]),th=window._th!=null?window._th:1;
  var map={};A.rows.forEach(function(r){map[r.id]=r});var seen={};
  var data=B.rows.map(function(r){var o=map[r.id];seen[r.id]=1;var d={};cols.forEach(function(x){d[x]=o?(r.m[x]||0)-(o.m[x]||0):null});return{r:r,isNew:!o,d:d,inact:!!o&&d[am]<th}}).sort(function(a,b){return(b.d[am]==null?-1e18:b.d[am])-(a.d[am]==null?-1e18:a.d[am])});
  var left=A.rows.filter(function(r){return!seen[r.id]}),inact=data.filter(function(x){return x.inact}).length;
  var opts=function(sel){return ss.map(function(s,i){return'<option value="'+i+'"'+(i==sel?' selected':'')+'>'+esc(s.date+(s.label?' – '+s.label:''))+'</option>'}).join('')};
  return'<div class="row"><div><label class="mut" style="font-size:12px">From</label><select id="ca">'+opts(ai)+'</select></div><div><label class="mut" style="font-size:12px">To</label><select id="cb">'+opts(bi)+'</select></div><div><label class="mut" style="font-size:12px">Activity measured by</label><select id="am">'+cols.map(function(x){return'<option'+(x==am?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select></div><div><label class="mut" style="font-size:12px">Minimum gain to count as active</label><input type="number" id="th" value="'+th+'" min="0"></div></div>'+
  '<div class="stats"><div class="stat"><b>'+Math.round((new Date(B.date)-new Date(A.date))/864e5)+' d</b><span>Between snapshots</span></div><div class="stat"><b class="'+(inact?'warn':'')+'">'+inact+'</b><span>Inactive on '+esc(am)+'</span></div><div class="stat"><b>'+data.filter(function(x){return x.isNew}).length+' / '+left.length+'</b><span>Joined / left</span></div></div>'+
  '<div class="card tw"><table><thead><tr><th>#</th><th>Name</th><th>Status</th>'+cols.map(function(x){return'<th>Δ '+esc(x)+'</th>'}).join('')+'</tr></thead><tbody>'+data.map(function(x,i){return'<tr data-id="'+esc(x.r.id)+'"><td>'+(i+1)+'</td><td><b>'+esc(x.r.name)+'</b></td><td>'+(x.isNew?'<span class="up">New</span>':x.inact?'<span class="warn">Inactive</span>':'')+'</td>'+cols.map(function(cn){var v=x.d[cn];return'<td class="'+(v>0?'up':v<0?'dn':'')+'">'+(x.isNew?'–':fd(v))+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'+(left.length?'<div class="card"><h2>Left the alliance</h2><p class="mut">'+left.map(function(r){return esc(r.name)}).join(', ')+'</p></div>':'');
}
function dataView(){
  var ss=allSnaps(),sharedKeys={};S.snaps.forEach(function(s){sharedKeys[s.date+'|'+(s.label||'')]=1});
  var list=ss.map(function(s,i){var sh=sharedKeys[s.date+'|'+(s.label||'')];return'<tr><td>'+esc(s.date)+'</td><td>'+esc(s.label||'')+'</td><td>'+s.rows.length+'</td><td>'+(sh?'<span class="mut">Published</span>':'<button class="btn" data-del="'+local.indexOf(s)+'">Delete</button>')+'</td></tr>'}).join('');
  return'<div class="card"><h2>Add a snapshot</h2><p class="mut" style="font-size:13px;margin-top:0">Paste the CSV exported from the Alliance activity page (first row must be the headers). Ranks are kept from the previous snapshot for existing members; new members default to R1 and can be fixed in data.json.</p><textarea id="paste" placeholder="#,Player,Usefulness Score,ID,Gifts,Power,Forts destroyed,Technology points,..."></textarea><div class="row"><div><label class="mut" style="font-size:12px">Scan date</label><input type="date" id="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div><label class="mut" style="font-size:12px">Label (optional)</label><input id="label" placeholder="e.g. KvK day 3"></div><div style="flex:0"><button class="btn pri" id="add">Save snapshot</button></div></div><div class="msg">'+esc(msg)+'</div></div>'+
  '<div class="card"><h2>Snapshots</h2><div class="tw"><table><thead><tr><th>Date</th><th>Label</th><th>Members</th><th></th></tr></thead><tbody>'+list+'</tbody></table></div></div>'+
  '<div class="card"><h2>Publish to your website</h2><p class="mut" style="font-size:13px;margin-top:0">Snapshots you add here live only in this browser. To show them to everyone: click Export, then upload the file as <b>data.json</b> to your GitHub repo (replace the old one).</p><div class="row"><div style="flex:0"><button class="btn pri" id="exp">Export data.json</button></div></div>'+(window._json?'<textarea id="jo" readonly style="min-height:90px">'+esc(window._json)+'</textarea>':'')+'</div>';
}
function parseCSV(t){
  var rows=[],r=[],c='',q=false;t=t.replace(/^﻿/,'');
  for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}return rows;
}
function snapFromCSV(text,date,label){
  var R=parseCSV(text),H=R[0].map(function(h){return h.trim()}),ix=function(n){return H.indexOf(n)};
  if(ix('ID')<0||ix('Player')<0)throw new Error('This does not look like the alliance activity CSV (need Player and ID columns).');
  var map={'Usefulness %':'Usefulness Score','Power':'Power','Forts destroyed':'Forts destroyed','Tech points':'Technology points','Alliance helps':'Alliance helps','Resource assistance':'Resource assistance','Armory points':'Armory points','Kill points':'Kill points','Gifts':'Gifts','Gift score':'Gift Score'},cols=Object.keys(map).concat(['Building time (h)']);
  var prev=cur(),pr={};if(prev)prev.rows.forEach(function(r){pr[r.id]=r.rank});
  var rows=R.slice(1).filter(function(r){return r.length>3}).map(function(r){var m={};Object.keys(map).forEach(function(k){m[k]=ix(map[k])>=0?num(r[ix(map[k])])||0:0});m['Building time (h)']=ix('Building time (seconds)')>=0?Math.round(100*(num(r[ix('Building time (seconds)')])||0)/3600)/100:0;var id=r[ix('ID')].trim();return{id:id,name:r[ix('Player')],rank:pr[id]||'R1',last:ix('Last login')>=0?r[ix('Last login')].slice(0,19):'',m:m}});
  if(!rows.length)throw new Error('No member rows found.');
  return{date:date,label:label,cols:cols,rows:rows};
}
function exportJson(){
  var all=allSnaps(),json=JSON.stringify({info:S.info,snaps:all});window._json=json;
  try{var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(json);a.download='data.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}
  msg='If no file downloaded, copy the text below into a file named data.json.';render();
}
function bind(){
  document.querySelectorAll('[data-id]').forEach(function(e){e.onclick=function(){openMember(e.getAttribute('data-id'))}});
  document.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){F[b.getAttribute('data-f')]=b.getAttribute('data-v');render()}});
  document.querySelectorAll('th[data-sort]').forEach(function(h){h.onclick=function(){F.sort=h.getAttribute('data-sort');render()}});
  if($('q'))$('q').oninput=function(){F.q=this.value;var p=this.selectionStart;render();var n=$('q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  if($('sort'))$('sort').onchange=function(){F.sort=this.value;render()};
  if($('ca')){$('ca').onchange=function(){window._ca=+this.value;render()};$('cb').onchange=function(){window._cb=+this.value;render()};$('am').onchange=function(){window._am=this.value;render()};$('th').onchange=function(){window._th=Math.max(0,+this.value||0);render()}}
  if($('add'))$('add').onclick=function(){try{var d=$('date').value;if(!d)throw new Error('Pick a scan date.');var s=snapFromCSV($('paste').value,d,$('label').value.trim());local.push(s);if(saveLocal())msg='Saved '+s.rows.length+' members.'}catch(e){msg=e.message}render()};
  document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var i=+b.getAttribute('data-del');if(i>=0&&confirm('Delete this snapshot?')){local.splice(i,1);saveLocal();render()}}});
  if($('exp'))$('exp').onclick=exportJson;
}
function loadShared(){try{fetch('data.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(o){if(!o||!o.snaps||!o.snaps.length)return;S={info:o.info||S.info,snaps:o.snaps};render()}).catch(function(){})}catch(e){}}
load();render();loadShared();
</script>
